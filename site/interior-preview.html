<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interior preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #444; font: 14px system-ui, "PingFang SC", sans-serif; overflow: hidden; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; }
  #c { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lb { position: absolute; transform: translate(-50%, -100%); background: rgba(255,255,255,.88); color: #6b4a3a; border-radius: 999px;
        padding: 2px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .lb.on { background: #ff8fab; color: #fff; }
  .bar { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  button { border: 1px solid #e3c9b8; background: #fff; border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 12px; }
  #stat { position: absolute; top: 6px; left: 6px; font-size: 11px; color: #654; background: rgba(255,255,255,.75); padding: 3px 7px; border-radius: 6px; }
  #picked { position: absolute; top: 6px; right: 6px; font-size: 14px; color: #fff; background: #ff8fab; padding: 4px 10px; border-radius: 8px; display: none; }
  #err { position: fixed; left: 0; right: 0; top: 0; background: #c33; color: #fff; font: 12px monospace; white-space: pre-wrap; padding: 6px; display: none; z-index: 9; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
<script>
  // 页面上的错误直接显示出来（headless 截图也能看到）
  window.__errs = [];
  const showErr = (m) => { window.__errs.push(String(m)); const e = document.getElementById("err"); if (e) { e.style.display = "block"; e.textContent = window.__errs.join("\n"); } };
  addEventListener("error", (e) => showErr(e.message + " @" + (e.filename || "") + ":" + (e.lineno || "")));
  addEventListener("unhandledrejection", (e) => showErr("promise: " + (e.reason && e.reason.stack || e.reason)));
  const ce = console.error; console.error = (...a) => { showErr(a.join(" ")); ce.apply(console, a); };
</script>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="labels"></div><div id="stat"></div><div id="picked"></div><div class="bar" id="bar"></div></div>
<div id="err"></div>
<script type="module">
// ?night  ?cook=0.8  ?aq（水族箱解锁） ?w=390&h=844（固定画框） ?labels=0 ?hi=<id> ?photos=3 ?empty（不放占位蛋/鱼/宠物） ?t=<秒>（定格时间）
import * as THREE from "three";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { buildInterior, INTERIOR_IDS, INTERIOR_LABELS } from "./interior3d.js?v=15";

const params = new URLSearchParams(location.search);
const canvas = document.getElementById("c");
const wrap = document.getElementById("wrap");
if (params.get("w") && params.get("h")) { wrap.style.width = params.get("w") + "px"; wrap.style.height = params.get("h") + "px"; }
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

// 和 scene3d.js 一样的 toon / outlined
const grad = new THREE.DataTexture(new Uint8Array([110, 185, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...extra });
function outlined(mesh, thickness = 0.04) {
  const g = mesh.geometry.clone();
  for (const k of Object.keys(g.attributes)) if (k !== "position") g.deleteAttribute(k);
  const m = mergeVertices(g, 1e-4);
  m.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({ color: 0x4a2f25, side: THREE.BackSide });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.thickness = { value: thickness };
    sh.vertexShader = "uniform float thickness;\n" + sh.vertexShader.replace(
      "#include <begin_vertex>", "#include <begin_vertex>\ntransformed += normalize(normal) * thickness;");
  };
  const o = new THREE.Mesh(m, mat);
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}
const T = { toon, outlined };

const room = buildInterior(T);
window.room = room;

// 照片：彩色画布（不同比例），检验裁切
const nPhotos = params.has("photos") ? +params.get("photos") : 4;
const photoTex = [
  [640, 480, "#ffb3c4", "🌸"], [480, 640, "#a8e0cc", "🐱"], [800, 400, "#ffd98a", "🌅"],
  [600, 600, "#c9b6ff", "🦕"], [400, 700, "#9fd3ff", "🌊"], [700, 500, "#ffc2a3", "🍰"],
].slice(0, nPhotos).map(([w, h, bg, emo]) => {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.fillStyle = "rgba(255,255,255,.5)"; for (let i = 0; i < 8; i++) { x.beginPath(); x.arc((i * 97) % w, (i * 151) % h, 40, 0, 7); x.fill(); }
  x.strokeStyle = "#fff"; x.lineWidth = 10; x.strokeRect(5, 5, w - 10, h - 10); // 外圈白边：能看出裁切
  x.font = `${Math.min(w, h) * 0.45}px serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(emo, w / 2, h / 2);
  const t = new THREE.CanvasTexture(c);
  return t;
});
room.setPhotos(photoTex);

// 占位：两个蛋、6 条鱼、3 只睡觉的小团子、1 个访客
if (!params.has("empty")) {
  const eggCols = [0xfff1d6, 0xd8f0ff];
  room.slots.incubator.forEach((s, i) => {
    const e = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.05, 14, 10), toon(eggCols[i])), 0.008);
    e.scale.set(1, 1.2, 1); e.position.y = 0.06;
    const spot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), toon(0xff9fb0)); spot.position.set(0.02, 0.01, 0.045); e.add(spot);
    s.add(e);
  });
  const aq = room.slots.aquarium, fishCols = [0xffb27a, 0xffe08a, 0xff9fb8, 0x9fd8ff, 0xb8f0b0, 0xc9b6ff];
  window.fish = fishCols.map((c, i) => {
    const f = new THREE.Group();
    const body = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), toon(c)), 0.02);
    body.scale.set(1.5, 1, 0.7);
    const tail = outlined(new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.18, 4), toon(c)), 0.02);
    tail.rotation.z = Math.PI / 2; tail.position.x = -0.28;
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshBasicMaterial({ color: 0x3a2a25 }));
    eye.position.set(0.14, 0.04, 0.09);
    f.add(body, tail, eye);
    f.scale.setScalar(0.35);
    f.userData = { ph: i * 1.1, r: 0.1 + (i % 3) * 0.08, y: ((i % 3) - 1) * aq.h * 0.25 };
    aq.group.add(f);
    return f;
  });
  const petCols = [0xfff7ee, 0xffd2a8, 0xb8e8ff];
  room.slots.petBeds.forEach((s, i) => {
    const p = outlined(new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), toon(petCols[i])), 0.01);
    p.scale.set(1.1, 0.8, 1); p.position.y = 0.085;
    for (const sx of [-1, 1]) { const ear = outlined(new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.07, 8), toon(petCols[i])), 0.008); ear.position.set(sx * 0.06, 0.12, 0); p.add(ear); }
    s.add(p);
  });
  const vis = new THREE.Group();
  const vb = outlined(new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.22, 4, 12), toon(0xbfe3a0)), 0.012); vb.position.y = 0.23;
  const vh = outlined(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.1, 12), toon(0xffffff)), 0.01); vh.position.y = 0.47;
  vis.add(vb, vh);
  room.slots.visitorSpot.add(vis);
}

// 状态
let night = params.has("night"), cookK = params.has("cook") ? +params.get("cook") || 1 : 0, aqOpen = params.has("aq"), showLabels = params.get("labels") !== "0";
room.setNight(night); room.cook(cookK); room.setAquariumVisible(aqOpen);
if (params.get("hi")) room.highlight(params.get("hi"));

const bar = document.getElementById("bar");
const btn = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = (e) => { e.stopPropagation(); fn(); }; bar.appendChild(b); };
btn("🌙 夜/昼", () => { night = !night; room.setNight(night); });
btn("🍲 做饭", () => { cookK = cookK > 0.5 ? 0 : 1; room.cook(cookK); });
btn("🐠 水族箱", () => { aqOpen = !aqOpen; room.setAquariumVisible(aqOpen); });
btn("🏷️ 标签", () => { showLabels = !showLabels; });
btn("🖼️ 照片", () => { room.setPhotos(room.__ph = room.__ph ? null : photoTex); });

// 标签
const lbBox = document.getElementById("labels");
const lbs = Object.fromEntries(INTERIOR_IDS.map((id) => { const d = document.createElement("div"); d.className = "lb"; d.textContent = INTERIOR_LABELS[id]; lbBox.appendChild(d); return [id, d]; }));
let picked = null;
const pk = document.getElementById("picked");
canvas.addEventListener("pointerdown", (e) => {
  const r = canvas.getBoundingClientRect();
  const id = room.pick(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  picked = id;
  room.highlight(id);
  pk.style.display = "block";
  pk.textContent = id ? `${INTERIOR_LABELS[id]}  (${id})` : "（空）";
});
window.pickAt = (px, py) => { const r = canvas.getBoundingClientRect(); return room.pick((px / r.width) * 2 - 1, -(py / r.height) * 2 + 1); };

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  room.resize(w, h);
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
const fixedT = params.has("t") ? +params.get("t") : null;
const st = document.getElementById("stat");
let frames = 0, fpsT = 0, last = 0;
const out = { x: 0, y: 0 };
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta());
  const t = fixedT != null ? fixedT + clock.elapsedTime * 0 : clock.elapsedTime;
  room.update(fixedT != null ? fixedT : t, fixedT != null ? 0.05 : dt);
  if (window.fish) window.fish.forEach((f) => {
    const a = t * 0.6 + f.userData.ph, aq = room.slots.aquarium;
    f.position.set(Math.cos(a) * aq.w * 0.38, f.userData.y + Math.sin(a * 2) * 0.02, Math.sin(a) * aq.d * 0.3);
    f.rotation.y = -a - Math.PI / 2;
  });
  renderer.render(room.scene, room.camera);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  for (const id of INTERIOR_IDS) {
    const d = lbs[id];
    d.style.display = showLabels ? "block" : "none";
    if (!showLabels) continue;
    room.hotspotScreen(id, w, h, out);
    d.style.left = out.x + "px"; d.style.top = out.y + "px";
    d.classList.toggle("on", id === picked);
    d.textContent = id === "aquarium" && !aqOpen ? "❓ 水族箱" : INTERIOR_LABELS[id];
  }
  frames++; fpsT += dt;
  const info = renderer.info.render;
  window.__draws = info.calls;
  if (fpsT > 0.5 || !last) { st.textContent = `${Math.round(frames / Math.max(fpsT, 1e-3))} fps · ${info.calls} draws · ${Math.round(info.triangles / 1000)}k tris · ${w}×${h}`; frames = 0; fpsT = 0; last = 1; }
});
window.__ready = true;
</script>
</body>
</html>
