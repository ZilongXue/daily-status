<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decor Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #bfe3f5; font-family: system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 8px; left: 8px; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  #err { color: #b00; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  decor preview: pink pole = 2.1u pet height, disc r=1.4 &nbsp;
  <label><input type="checkbox" id="toon" checked> toon</label>
  <label><input type="checkbox" id="spin"> spin</label>
  <div id="stat"></div><div id="err"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f5);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
const controls = new OrbitControls(camera, canvas);
scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa77, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(5, 10, 6); scene.add(sun);

const gradData = new Uint8Array([90, 170, 255]);
const grad = new THREE.DataTexture(gradData, 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;

function label(text) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 96;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(0, 0, 512, 96);
  g.fillStyle = '#333'; g.font = 'bold 44px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 50);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  sp.scale.set(2.4, 0.45, 1); return sp;
}

const toonables = [];
function toToon(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const conv = m => {
      const t = new THREE.MeshToonMaterial({ color: m.color ? m.color.clone() : 0xffffff, map: m.map || null,
        gradientMap: grad, side: m.side, transparent: m.transparent, opacity: m.opacity,
        vertexColors: !!o.geometry.attributes.color });
      return t;
    };
    const orig = o.material;
    const toon = Array.isArray(orig) ? orig.map(conv) : conv(orig);
    toonables.push({ o, orig, toon });
    o.material = toon;
  });
}
document.getElementById('toon').onchange = e => toonables.forEach(t => t.o.material = e.target.checked ? t.toon : t.orig);

const items = [];
const loader = new GLTFLoader();
const cat = await (await fetch('./vendor/decor/catalog.json', { cache: 'no-store' })).json();
const cols = Math.ceil(Math.sqrt(cat.length)), SP = 3.6;
let total = 0;
cat.forEach((e, i) => {
  const cx = (i % cols - (cols - 1) / 2) * SP, cz = (Math.floor(i / cols) - (Math.ceil(cat.length / cols) - 1) / 2) * SP;
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.3, 0.25, 40),
    new THREE.MeshToonMaterial({ color: 0x8fd16a, gradientMap: grad }));
  disc.position.set(cx, -0.125, cz); scene.add(disc);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.1, 8), new THREE.MeshBasicMaterial({ color: 0xff7fb0 }));
  pole.position.set(cx - 1.25, 1.05, cz + 1.25); scene.add(pole);
  const lb = label(`${e.id} ${e.name_zh}`); lb.position.set(cx, 3.0, cz); scene.add(lb);
  loader.load('./vendor/decor/' + e.file + '?t=' + Date.now(), g => {
    const m = g.scene;
    m.scale.setScalar(e.scale ?? 1);
    m.rotation.y = e.rotY ?? 0;
    m.position.set(cx, e.y ?? 0, cz);
    toToon(m);
    scene.add(m); items.push(m);
    const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3());
    total++;
    document.getElementById('stat').textContent = `loaded ${total}/${cat.length}`;
    console.log(e.id, 'size', s.toArray().map(v => v.toFixed(2)).join(' x '), 'minY', b.min.y.toFixed(2));
  }, undefined, err => { document.getElementById('err').textContent += `${e.id}: ${err.message || err}\n`; });
});

const span = cols * SP;
camera.position.set(0, span * 0.75, span * 1.0);
controls.target.set(0, 0.6, 0); controls.update();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const spin = document.getElementById('spin');
renderer.setAnimationLoop(t => {
  if (spin.checked) items.forEach(m => m.rotation.y += 0.01);
  controls.update(); renderer.render(scene, camera);
});
// ?focus=<id> zooms to one entry
const f = new URLSearchParams(location.search).get('focus');
if (f) {
  const i = cat.findIndex(e => e.id === f);
  if (i >= 0) {
    const cx = (i % cols - (cols - 1) / 2) * SP, cz = (Math.floor(i / cols) - (Math.ceil(cat.length / cols) - 1) / 2) * SP;
    controls.target.set(cx, 0.9, cz); camera.position.set(cx + 2.5, 2.6, cz + 5.5); controls.update();
  }
}
</script>
</body>
</html>
